name: latest.json

# À chaque release publiée (ou préversion promue en release), releases/latest.json est réécrit sur
# master d'après la PLUS HAUTE release publiée de cette chaîne (scripts/release-courante.sh), quel
# que soit l'ordre d'arrivée des événements, y compris quand elle est plus basse que celle du
# fichier : retirer une release (la supprimer, ou la repasser en préversion) puis relancer ce
# workflow à la main remet le fichier sur la plus haute qui reste. Une release d'avant la chaîne
# (son arbre n'a pas scripts/latest-json.py) est ignorée, même numérotée au-dessus ; s'il n'en reste
# aucune de la chaîne, le fichier est retiré, et aucune appli ne propose plus rien. C'est ce fichier
# que les applis de bureau, à partir de la 0.8.1, lisent pour proposer la mise à jour.
# Seul un compte de packaging/mainteneurs.txt (celui de master) y fait écrire une release.
# Lancé à la main avec « brouillon: vX.Y.Z », il fait sur ce brouillon tous les contrôles de la
# publication et n'écrit rien : à passer avant de publier.
# Le script et les listes viennent de l'étiquette de cette release ; master ne sert qu'à choisir
# la release, à nommer les mainteneurs et à écrire.
# Vérifié avant d'écrire : aucune ref qui se lirait à la place de master/releases/latest.json ou
# de main/releases/latest.json (les 0.2.x cherchent leur mise à jour sur main), l'étiquette sur
# master, l'attestation de chaque fichier que la CI joint (le run de release.yml sur le commit de
# cette étiquette), le certificat, le numéro et le contenu de l'APK, puis ce que
# scripts/latest-json.py contrôle.
# « contrôles » ne lance que des outils de l'image, rien de téléchargé ; « écrire » ne lance que git
# et refait, juste avant d'écrire, le contrôle du mainteneur et celui de la release courante : un
# job relancé seul ne réécrit pas un état passé. Un contrôle qui échoue n'écrit rien, sauf un cas :
# « secours » retire latest.json s'il désigne une release qui n'est plus publiée.
# Ces contrôles vivent dans le dépôt : un compte qui peut écrire peut aussi les modifier, et un
# fichier remplacé après la publication n'est revu qu'à la publication suivante.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      brouillon:
        description: "Contrôler à blanc le brouillon de cette étiquette (vX.Y.Z), sans rien écrire"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Lire un brouillon demande le droit d'écrire du jeton : ce job ne lance aucun outil téléchargé,
  # ses extractions ne gardent pas le jeton, et chaque étape qui appelle l'API le reçoit seule.
  controles:
    name: Contrôles
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: read
    outputs:
      etiquette: ${{ steps.choisir.outputs.etiquette }}
      chaine: ${{ steps.choisir.outputs.chaine }}
      latest: ${{ steps.script.outputs.latest }}
    env:
      ACTEUR: ${{ github.triggering_actor }}
      BROUILLON: ${{ inputs.brouillon }}
    steps:
      # raw.githubusercontent.com lit …/main/releases/latest.json dans la branche « main » comme
      # dans une branche « main/releases », et une étiquette du nom d'une branche peut passer avant
      # elle : « main », « main/… », « master/… » et les étiquettes « main », « master » sont refusées.
      - name: Aucune ref qui se lirait à la place de latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=''
          for prefixe in heads/main heads/master tags/main tags/master; do
            trouvees=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/${prefixe}" --jq '.[].ref')
            refs="$refs$trouvees"$'\n'
          done
          refs=$(printf '%s' "$refs" | grep -E '^refs/heads/main(/|$)|^refs/heads/master/|^refs/tags/(main|master)(/|$)' || true)
          if [ -n "$refs" ]; then
            while read -r r; do echo "✗ $r existe : une appli installée pourrait lire son latest.json"; done <<< "$refs"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          path: master
          persist-credentials: false
      - name: Celui qui publie est un mainteneur
        run: |
          mainteneurs=$(grep -vE '^[[:space:]]*(#|$)' master/packaging/mainteneurs.txt | awk '{print tolower($1)}')
          acteur=$(printf '%s' "$ACTEUR" | tr '[:upper:]' '[:lower:]')
          if ! grep -qxF "$acteur" <<< "$mainteneurs"; then
            echo "✗ ${ACTEUR} n'est pas dans packaging/mainteneurs.txt : latest.json n'est pas écrit"
            exit 1
          fi
          echo "✓ ${ACTEUR} est mainteneur"
      - name: La release — la plus haute de la chaîne, ou le brouillon demandé
        id: choisir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -x master/scripts/release-courante.sh \
            || { echo "✗ master ne porte pas scripts/release-courante.sh"; exit 1; }
          if [ -n "$BROUILLON" ]; then
            if [ "${BROUILLON#v}" = "$BROUILLON" ] \
              || ! master/scripts/version.sh --forme "${BROUILLON#v}" 2> /dev/null; then
              echo "✗ brouillon « $BROUILLON » : pas de la forme vX.Y.Z"
              exit 1
            fi
            # Le nom vient d'être borné à vX.Y.Z, sur une seule ligne : il peut entrer dans le filtre.
            ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$BROUILLON\") | .id")
            n=$(grep -c . <<< "$ids" || true)
            [ "$n" -eq 1 ] || { echo "✗ $n brouillon(s) pour $BROUILLON au lieu d'un"; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/releases/${ids}" > "$RUNNER_TEMP/release.json"
            etiquette=$BROUILLON
            echo "Le brouillon contrôlé à blanc : $etiquette"
          else
            etiquette=$(master/scripts/release-courante.sh)
            if [ -n "$etiquette" ]; then
              echo "La plus haute release de la chaîne : $etiquette"
            else
              echo "Aucune release publiée de cette chaîne : latest.json sera retiré"
            fi
          fi
          if [ -n "$etiquette" ]; then chaine=1; else chaine=0; fi
          echo "etiquette=$etiquette" >> "$GITHUB_OUTPUT"
          echo "chaine=$chaine" >> "$GITHUB_OUTPUT"
          echo "ETIQUETTE=$etiquette" >> "$GITHUB_ENV"
          echo "NUMERO=${etiquette#v}" >> "$GITHUB_ENV"
      # Qualifiée : une branche du même nom passerait sinon avant l'étiquette.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.choisir.outputs.chaine == '1'
        with:
          ref: refs/tags/${{ env.ETIQUETTE }}
          path: etiquette
          persist-credentials: false
      - name: L'étiquette désigne un commit de master, et porte cette chaîne
        if: steps.choisir.outputs.chaine == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git -C etiquette rev-parse HEAD)
          statut=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${sha}" --jq .status)
          case "$statut" in
            identical|behind) echo "✓ ${ETIQUETTE} (${sha}) est sur master" ;;
            *) echo "✗ ${ETIQUETTE} (${sha}) n'est pas sur master ($statut)"; exit 1 ;;
          esac
          test -f etiquette/scripts/latest-json.py \
            || { echo "✗ ${ETIQUETTE} ne porte pas scripts/latest-json.py"; exit 1; }
          echo "COMMIT=$sha" >> "$GITHUB_ENV"
      - name: Ce que le script contrôle, écrit à part
        id: script
        if: steps.choisir.outputs.chaine == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=()
          if [ -n "$BROUILLON" ]; then
            mode=(--brouillon)
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${ETIQUETTE}" > "$RUNNER_TEMP/release.json"
          fi
          python3 -B etiquette/scripts/latest-json.py "${mode[@]}" "$RUNNER_TEMP/release.json" \
            "$RUNNER_TEMP/latest.json" "$GITHUB_REPOSITORY"
          echo "latest=$(base64 -w0 "$RUNNER_TEMP/latest.json")" >> "$GITHUB_OUTPUT"
      # L'attestation est liée au commit : une étiquette déplacée après la construction la fait refuser.
      - name: Chaque fichier que la CI joint vient du run de release.yml sur ce commit
        if: steps.choisir.outputs.chaine == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          artefacts=$(etiquette/scripts/fichiers.sh artefacts --ci)
          noms=$(while read -r a; do etiquette/scripts/fichiers.sh noms "$NUMERO" "$a" || exit 1; done <<< "$artefacts")
          while read -r nom; do
            gh release download "$ETIQUETTE" -R "$GITHUB_REPOSITORY" -p "$nom" -D "$RUNNER_TEMP/ci"
            gh attestation verify "$RUNNER_TEMP/ci/$nom" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${ETIQUETTE}" --source-digest "$COMMIT" \
              --deny-self-hosted-runners > /dev/null
            echo "✓ $nom"
          done <<< "$noms"
      - name: L'APK joint
        if: steps.choisir.outputs.chaine == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(etiquette/scripts/fichiers.sh nom "$NUMERO" android-apk)
          gh release download "$ETIQUETTE" -R "$GITHUB_REPOSITORY" -p "$apk" -D "$RUNNER_TEMP"
      # apksigner et aapt de l'image, à la version du job Android de release.yml : rien n'est
      # téléchargé dans ce job, qui tient le droit d'écrire.
      - name: L'APK porte le certificat publié, le numéro de la release et le contenu du relevé
        if: steps.choisir.outputs.chaine == '1'
        run: |
          apk="$RUNNER_TEMP/$(etiquette/scripts/fichiers.sh nom "$NUMERO" android-apk)"
          releve="$RUNNER_TEMP/ci/$(etiquette/scripts/fichiers.sh nom "$NUMERO" android-contenu)"
          outils="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$outils/apksigner" && test -x "$outils/aapt" \
            || { echo "✗ apksigner ou aapt 34.0.0 absent de l'image : rien n'est téléchargé ici"; exit 1; }
          empreinte=$(grep -E '^[0-9a-f]{64}$' etiquette/packaging/empreinte-apk.txt)
          certificats=$("$outils/apksigner" verify --print-certs "$apk")
          [ "$(printf '%s\n' "$certificats" | grep -c 'certificate SHA-256 digest:')" -eq 1 ] \
            || { echo "✗ $apk : un seul signataire attendu"; exit 1; }
          printf '%s\n' "$certificats" | grep -qF "certificate SHA-256 digest: $empreinte" \
            || { echo "✗ $apk n'est pas signé par le certificat de packaging/empreinte-apk.txt"; exit 1; }
          IFS=. read -r majeur mineur correctif <<< "$NUMERO"
          code=$((majeur * 1000000 + mineur * 1000 + correctif))
          "$outils/aapt" dump badging "$apk" | head -n 1 \
            | grep -qF "versionCode='$code' versionName='$NUMERO'" \
            || { echo "✗ $apk ne porte pas versionCode $code et versionName $NUMERO"; exit 1; }
          echo "✓ $apk : certificat et numéro"
          python3 -B etiquette/scripts/contenu-apk.py "$apk" "$releve"

  # Une file par acteur : un run refusé n'y entre jamais, et ne prend donc la place de personne.
  ecrire:
    name: Écrire sur master
    needs: controles
    if: ${{ !cancelled() && !inputs.brouillon && needs.controles.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: latest-json-ecrire-${{ github.triggering_actor }}
      cancel-in-progress: false
    env:
      ACTEUR: ${{ github.triggering_actor }}
      EVENEMENT: ${{ github.event_name }}
      ETIQUETTE: ${{ needs.controles.outputs.etiquette }}
      CHAINE: ${{ needs.controles.outputs.chaine }}
      LATEST: ${{ needs.controles.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
      # Relancé seul, ce job reprend les sorties d'un run passé : il ne les écrit que si celui qui
      # relance est mainteneur et si la release courante est toujours celle-là.
      - name: Le mainteneur et la release courante, revus avant d'écrire
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mainteneurs=$(grep -vE '^[[:space:]]*(#|$)' packaging/mainteneurs.txt | awk '{print tolower($1)}')
          acteur=$(printf '%s' "$ACTEUR" | tr '[:upper:]' '[:lower:]')
          grep -qxF "$acteur" <<< "$mainteneurs" \
            || { echo "✗ ${ACTEUR} n'est pas dans packaging/mainteneurs.txt : latest.json n'est pas écrit"; exit 1; }
          courante=$(scripts/release-courante.sh)
          if [ "$courante" != "$ETIQUETTE" ]; then
            echo "✗ la release courante est « ${courante:-aucune} »,"
            echo "  ce run a contrôlé « ${ETIQUETTE:-aucune} » : rien n'est écrit"
            exit 1
          fi
          echo "✓ ${ACTEUR} est mainteneur, et « ${ETIQUETTE:-aucune} » est toujours la release courante"
      - name: Commiter sur master
        run: |
          if [ "$CHAINE" = 1 ]; then
            mkdir -p releases
            base64 -d <<< "$LATEST" > releases/latest.json
          else
            rm -f releases/latest.json
          fi
          if [ -z "$(git status --porcelain -- releases/latest.json)" ]; then
            echo "latest.json inchangé"
            exit 0
          fi
          if [ "$EVENEMENT" = release ]; then quoi="publiée par ${ACTEUR}"; else quoi="relancé à la main par ${ACTEUR}"; fi
          titre="latest.json : ${ETIQUETTE}"
          if [ "$CHAINE" != 1 ]; then titre="latest.json retiré : aucune release de la chaîne"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- releases/latest.json
          git commit -m "${titre}, ${quoi}"
          # Un envoi humain sur master entre la lecture et l'écriture : on reprend sur la tête nouvelle.
          for essai in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            echo "envoi refusé (essai $essai), reprise sur la tête de master"
            git pull --rebase origin master
          done
          echo "✗ latest.json n'a pas pu être envoyé sur master"
          exit 1

  # Un contrôle refusé laisse latest.json tel quel : s'il désigne une release qui n'est plus
  # publiée (supprimée, ou repassée en préversion), il est retiré, quel que soit l'acteur.
  secours:
    name: Secours — latest.json sur une release retirée
    needs: [controles, ecrire]
    if: ${{ failure() && !inputs.brouillon }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: latest-json-secours-${{ github.triggering_actor }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
      - name: Retirer latest.json s'il désigne une release qui n'est plus publiée
        run: |
          if [ ! -f releases/latest.json ]; then
            echo "aucun latest.json sur master"
            exit 0
          fi
          version=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' \
            releases/latest.json)
          publiees=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name')
          if grep -qxF "v$version" <<< "$publiees"; then
            echo "latest.json désigne v$version, toujours publiée : rien à retirer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q -- releases/latest.json
          git commit -m "latest.json retiré : v$version n'est plus publiée"
          for essai in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            echo "envoi refusé (essai $essai), reprise sur la tête de master"
            git pull --rebase origin master
          done
          echo "✗ le retrait de latest.json n'a pas pu être envoyé sur master"
          exit 1
