name: latest.json

# À chaque release publiée (ou préversion promue en release), releases/latest.json est réécrit sur
# master d'après la PLUS HAUTE release publiée de la forme vX.Y.Z, quel que soit l'ordre d'arrivée
# des événements, y compris quand elle est plus basse que celle du fichier : retirer une release
# (la supprimer, ou la repasser en préversion) puis relancer ce workflow à la main remet le fichier
# sur la plus haute qui reste ; si elle précède cette chaîne (son arbre n'a pas
# scripts/latest-json.py), le fichier est retiré, et aucune appli ne propose plus rien. C'est ce
# fichier que les applis de bureau, à partir de la 0.8.1, lisent pour proposer la mise à jour.
# Seul un compte de packaging/mainteneurs.txt (celui de master) publie ou relance.
# Le script et les listes viennent de l'étiquette de cette release ; master ne sert qu'à choisir
# la release (scripts/version.sh --forme), à nommer les mainteneurs et à écrire.
# Vérifié avant d'écrire : aucune ref qui se lirait à la place de master/releases/latest.json ou
# de main/releases/latest.json (les 0.2.x cherchent leur mise à jour sur main), l'étiquette sur
# master, l'attestation de chaque fichier que la CI joint (le run de release.yml sur le commit de
# cette étiquette), le certificat, le numéro et le contenu de l'APK, puis ce que
# scripts/latest-json.py contrôle.
# Ces contrôles vivent dans le dépôt : un compte qui peut écrire peut aussi les modifier, et un
# fichier remplacé après la publication n'est revu qu'à la publication suivante.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-json
  cancel-in-progress: false

jobs:
  latest:
    name: Mettre latest.json à jour
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      ACTEUR: ${{ github.triggering_actor }}
      EVENEMENT: ${{ github.event_name }}
    steps:
      # raw.githubusercontent.com lit …/main/releases/latest.json dans la branche « main » comme
      # dans une branche « main/releases », et une étiquette du nom d'une branche peut passer avant
      # elle : « main », « main/… », « master/… » et les étiquettes « main », « master » sont refusées.
      - name: Aucune ref qui se lirait à la place de latest.json
        run: |
          refs=''
          for prefixe in heads/main heads/master tags/main tags/master; do
            trouvees=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/${prefixe}" --jq '.[].ref')
            refs="$refs$trouvees"$'\n'
          done
          refs=$(printf '%s' "$refs" | grep -E '^refs/heads/main(/|$)|^refs/heads/master/|^refs/tags/(main|master)(/|$)' || true)
          if [ -n "$refs" ]; then
            while read -r r; do echo "✗ $r existe : une appli installée pourrait lire son latest.json"; done <<< "$refs"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          path: master
      - name: Celui qui publie est un mainteneur
        run: |
          mainteneurs=$(grep -vE '^[[:space:]]*(#|$)' master/packaging/mainteneurs.txt | awk '{print tolower($1)}')
          acteur=$(printf '%s' "$ACTEUR" | tr '[:upper:]' '[:lower:]')
          if ! grep -qxF "$acteur" <<< "$mainteneurs"; then
            echo "✗ ${ACTEUR} n'est pas dans packaging/mainteneurs.txt : latest.json n'est pas écrit"
            exit 1
          fi
          echo "✓ ${ACTEUR} est mainteneur"
      - name: La plus haute release publiée
        run: |
          test -x master/scripts/version.sh || { echo "✗ master ne porte pas scripts/version.sh"; exit 1; }
          publiees=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name')
          valides=''
          while read -r e; do
            [ -n "$e" ] || continue
            if [ "${e#v}" != "$e" ] && master/scripts/version.sh --forme "${e#v}" 2> /dev/null; then
              valides="$valides$e"$'\n'
            else
              echo "release ignorée, pas de la forme vX.Y.Z : $e"
            fi
          done <<< "$publiees"
          etiquette=$(printf '%s' "$valides" | sort -V | tail -n 1)
          if [ -z "$etiquette" ]; then
            echo "✗ aucune release publiée de la forme vX.Y.Z"
            exit 1
          fi
          echo "La plus haute release publiée : $etiquette"
          echo "ETIQUETTE=$etiquette" >> "$GITHUB_ENV"
          echo "NUMERO=${etiquette#v}" >> "$GITHUB_ENV"
      # Qualifiée : une branche du même nom passerait sinon avant l'étiquette.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.ETIQUETTE }}
          path: etiquette
      - name: L'étiquette désigne un commit de master
        run: |
          sha=$(git -C etiquette rev-parse HEAD)
          statut=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${sha}" --jq .status)
          case "$statut" in
            identical|behind) echo "✓ ${ETIQUETTE} (${sha}) est sur master" ;;
            *) echo "✗ ${ETIQUETTE} (${sha}) n'est pas sur master ($statut)"; exit 1 ;;
          esac
          echo "COMMIT=$sha" >> "$GITHUB_ENV"
      - name: La release vient-elle de cette chaîne ?
        run: |
          if [ -f etiquette/scripts/latest-json.py ]; then
            echo "CHAINE=1" >> "$GITHUB_ENV"
          else
            echo "${ETIQUETTE} précède cette chaîne : latest.json sera retiré"
            echo "CHAINE=0" >> "$GITHUB_ENV"
          fi
      - name: Ce que le script contrôle, écrit à part
        if: env.CHAINE == '1'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${ETIQUETTE}" > "$RUNNER_TEMP/release.json"
          mkdir -p "$RUNNER_TEMP/neuf"
          python3 -B etiquette/scripts/latest-json.py "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/neuf/latest.json" "$GITHUB_REPOSITORY"
      # L'attestation est liée au commit : une étiquette déplacée après la construction la fait refuser.
      - name: Chaque fichier que la CI joint vient du run de release.yml sur ce commit
        if: env.CHAINE == '1'
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          artefacts=$(etiquette/scripts/fichiers.sh artefacts --ci)
          noms=$(while read -r a; do etiquette/scripts/fichiers.sh noms "$NUMERO" "$a" || exit 1; done <<< "$artefacts")
          while read -r nom; do
            gh release download "$ETIQUETTE" -R "$GITHUB_REPOSITORY" -p "$nom" -D "$RUNNER_TEMP/ci"
            gh attestation verify "$RUNNER_TEMP/ci/$nom" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${ETIQUETTE}" --source-digest "$COMMIT" \
              --deny-self-hosted-runners > /dev/null
            echo "✓ $nom"
          done <<< "$noms"
      # Les outils Android de la vérification, installés ici plutôt que pris dans l'image du runner :
      # la version de build-tools est celle du job Android de release.yml.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.CHAINE == '1'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.CHAINE == '1'
      - name: build-tools 34.0.0
        if: env.CHAINE == '1'
        run: sdkmanager "build-tools;34.0.0"
      - name: L'APK porte le certificat publié, le numéro de la release et le contenu du relevé
        if: env.CHAINE == '1'
        run: |
          apk=$(etiquette/scripts/fichiers.sh nom "$NUMERO" android-apk)
          releve=$(etiquette/scripts/fichiers.sh nom "$NUMERO" android-contenu)
          gh release download "$ETIQUETTE" -R "$GITHUB_REPOSITORY" -p "$apk" -D "$RUNNER_TEMP"
          outils="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$outils/apksigner" && test -x "$outils/aapt" || { echo "✗ apksigner ou aapt absent de $outils"; exit 1; }
          empreinte=$(grep -E '^[0-9a-f]{64}$' etiquette/packaging/empreinte-apk.txt)
          certificats=$("$outils/apksigner" verify --print-certs "$RUNNER_TEMP/$apk")
          [ "$(printf '%s\n' "$certificats" | grep -c 'certificate SHA-256 digest:')" -eq 1 ] \
            || { echo "✗ $apk : un seul signataire attendu"; exit 1; }
          printf '%s\n' "$certificats" | grep -qF "certificate SHA-256 digest: $empreinte" \
            || { echo "✗ $apk n'est pas signé par le certificat de packaging/empreinte-apk.txt"; exit 1; }
          IFS=. read -r majeur mineur correctif <<< "$NUMERO"
          code=$((majeur * 1000000 + mineur * 1000 + correctif))
          "$outils/aapt" dump badging "$RUNNER_TEMP/$apk" | head -n 1 \
            | grep -qF "versionCode='$code' versionName='$NUMERO'" \
            || { echo "✗ $apk ne porte pas versionCode $code et versionName $NUMERO"; exit 1; }
          echo "✓ $apk : certificat et numéro"
          python3 -B etiquette/scripts/contenu-apk.py "$RUNNER_TEMP/$apk" "$RUNNER_TEMP/ci/$releve"
      - name: Commiter sur master
        working-directory: master
        run: |
          if [ "$CHAINE" = 1 ]; then
            mkdir -p releases
            cp "$RUNNER_TEMP/neuf/latest.json" releases/latest.json
          else
            rm -f releases/latest.json
          fi
          if [ -z "$(git status --porcelain -- releases/latest.json)" ]; then
            echo "latest.json inchangé"
            exit 0
          fi
          if [ "$EVENEMENT" = release ]; then quoi="publiée par ${ACTEUR}"; else quoi="relancé à la main par ${ACTEUR}"; fi
          titre="latest.json : ${ETIQUETTE}"
          if [ "$CHAINE" != 1 ]; then titre="latest.json retiré : ${ETIQUETTE} précède la chaîne"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- releases/latest.json
          git commit -m "${titre}, ${quoi}"
          # Un envoi humain sur master entre la lecture et l'écriture : on reprend sur la tête nouvelle.
          for essai in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            echo "envoi refusé (essai $essai), reprise sur la tête de master"
            git pull --rebase origin master
          done
          echo "✗ latest.json n'a pas pu être envoyé sur master"
          exit 1
