name: Build & Release

# Une étiquette vX.Y.Z poussée construit tous les formats et prépare une release en BROUILLON.
# Un lancement à la main construit seulement, quelle que soit la référence : les fichiers restent
# en artefacts, aucune release n'est créée.
# L'APK sort non signé : la clé de signature n'entre jamais sur GitHub, l'APK signé est joint au
# brouillon avant sa publication ; le relevé de son contenu, lui, est joint par la CI. Publier le
# brouillon met releases/latest.json à jour (latest-json.yml).
# Les noms des fichiers viennent de packaging/fichiers.txt, et d'aucun autre endroit.
# Aucun cache : un binaire de release se construit depuis le seul code étiqueté. Les outils que
# l'AppImage télécharge à sa construction, et Gradle, sont figés à l'empreinte près
# (packaging/outils-appimage.txt, packaging/gradle.txt) ; AGENTS.md dit ce qui ne l'est pas.
# Le brouillon ne prend que les artefacts que chaque job de construction désigne par son
# identifiant, et chaque fichier que la CI joint porte une attestation de provenance, que
# latest-json.yml vérifie. Seule une étiquette poussée par un compte de
# packaging/mainteneurs.txt prépare un brouillon.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI: "2.12.2"
  RUST: "1.99.0"

jobs:

  version:
    name: Numéro de version
    runs-on: ubuntu-22.04
    outputs:
      numero: ${{ steps.lire.outputs.numero }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: L'étiquette, tauri.conf.json, Cargo.toml et Cargo.lock disent le même numéro
        id: lire
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            numero=$(scripts/version.sh --verifier "$REF_NAME")
          else
            numero=$(scripts/version.sh --verifier)
          fi
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
      - name: L'étiquette est poussée par un mainteneur
        if: github.event_name == 'push'
        env:
          ACTEUR: ${{ github.triggering_actor }}
        run: |
          mainteneurs=$(grep -vE '^[[:space:]]*(#|$)' packaging/mainteneurs.txt | awk '{print tolower($1)}')
          acteur=$(printf '%s' "$ACTEUR" | tr '[:upper:]' '[:lower:]')
          if ! grep -qxF "$acteur" <<< "$mainteneurs"; then
            echo "✗ ${ACTEUR} n'est pas dans packaging/mainteneurs.txt : aucun brouillon"
            exit 1
          fi
          echo "✓ ${ACTEUR} est mainteneur"
      - name: L'étiquette poussée désigne un commit de master
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          statut=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${GITHUB_SHA}" --jq .status)
          case "$statut" in
            identical|behind) echo "✓ ${GITHUB_SHA} est sur master ($statut)" ;;
            *) echo "✗ ${GITHUB_SHA} n'est pas sur master ($statut)"; exit 1 ;;
          esac
      - name: La liste des fichiers, et les notes qui nomment chacun
        run: |
          scripts/fichiers.sh verifier
          noms=$(scripts/fichiers.sh noms '{{VERSION}}')
          manque=0
          while read -r nom; do
            grep -qF "$nom" packaging/notes-de-version.md || { echo "✗ les notes ne nomment pas $nom"; manque=1; }
          done <<< "$noms"
          grep -qF '{{EMPREINTE_APK}}' packaging/notes-de-version.md || { echo "✗ les notes ne portent pas l'empreinte de l'APK"; manque=1; }
          exit $manque
      - name: L'empreinte du certificat de l'APK, une seule
        run: |
          n=$(grep -cE '^[0-9a-f]{64}$' packaging/empreinte-apk.txt || true)
          [ "$n" -eq 1 ] || { echo "✗ packaging/empreinte-apk.txt : $n empreinte(s) au lieu d'une"; exit 1; }
      - name: Cargo.lock est à jour
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

  # Chaque machine rend l'identifiant de son artefact sous le nom de cet artefact : le brouillon et
  # AUR ne téléchargent que ces identifiants, jamais un motif qu'un autre job pourrait remplir.
  bureau:
    name: ${{ matrix.nom }}
    needs: version
    outputs:
      linux-x86_64: ${{ steps.artefact.outputs.linux-x86_64 }}
      linux-arm64: ${{ steps.artefact.outputs.linux-arm64 }}
      windows-x86_64: ${{ steps.artefact.outputs.windows-x86_64 }}
      macos-universel: ${{ steps.artefact.outputs.macos-universel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Linux x86_64
            artefact: linux-x86_64
            machine: ubuntu-22.04
          - nom: Linux ARM64
            artefact: linux-arm64
            machine: ubuntu-22.04-arm
          - nom: Windows x86_64
            artefact: windows-x86_64
            machine: windows-latest
          - nom: macOS universel
            artefact: macos-universel
            machine: macos-latest
            cible: universal-apple-darwin
            cibles_rust: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dépendances système
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-gl
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST }}
          targets: ${{ matrix.cibles_rust }}
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI }}" --locked
      - name: Les outils de l'AppImage, déposés et vérifiés
        if: runner.os == 'Linux'
        run: |
          runtime=$(scripts/outils-appimage.sh deposer "$(uname -m)")
          echo "LDAI_RUNTIME_FILE=$runtime" >> "$GITHUB_ENV"
      - name: Construire
        if: ${{ !matrix.cible }}
        run: cargo tauri build
      - name: Construire (universel)
        if: ${{ matrix.cible }}
        run: cargo tauri build --target "${{ matrix.cible }}"
      - name: L'AppImage n'a rien téléchargé
        if: runner.os == 'Linux'
        run: scripts/outils-appimage.sh controler "$(uname -m)"
      - name: Windows sans installation, nommé par la liste
        if: runner.os == 'Windows'
        shell: bash
        env:
          NUMERO: ${{ needs.version.outputs.numero }}
        run: echo "ZIP=$(scripts/fichiers.sh nom "$NUMERO" windows-portable)" >> "$GITHUB_ENV"
      - name: Windows sans installation, l'archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/target/release/bundle/portable | Out-Null
          Compress-Archive -Path src-tauri/target/release/rn2c.exe -DestinationPath "src-tauri/target/release/bundle/portable/$env:ZIP"
      - name: Chaque fichier de la liste, produit une fois
        shell: bash
        env:
          ARTEFACT: ${{ matrix.artefact }}
          NUMERO: ${{ needs.version.outputs.numero }}
        run: scripts/fichiers.sh rassembler "$ARTEFACT" "$NUMERO" sortie
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: envoi
        with:
          name: ci-${{ matrix.artefact }}
          path: sortie/*
          if-no-files-found: error
      - name: L'identifiant de l'artefact, rendu par le job
        id: artefact
        shell: bash
        env:
          ARTEFACT: ${{ matrix.artefact }}
          ID: ${{ steps.envoi.outputs.artifact-id }}
        run: echo "$ARTEFACT=$ID" >> "$GITHUB_OUTPUT"

  android:
    name: Android (APK non signé)
    needs: version
    runs-on: ubuntu-22.04
    outputs:
      android-contenu: ${{ steps.envoi-releve.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Le sdkmanager de l'image, plutôt qu'un outil de plus téléchargé sans empreinte.
      - name: NDK 26, build-tools et plate-forme, par le sdkmanager de l'image
        run: |
          outils="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$outils/sdkmanager" || { echo "✗ $outils/sdkmanager absent de l'image"; exit 1; }
          echo "$outils" >> "$GITHUB_PATH"
          "$outils/sdkmanager" --licenses < <(yes) > /dev/null
          "$outils/sdkmanager" "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"
      - name: NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI }}" --locked
      - name: Projet Android
        run: cargo tauri android init
      - name: Gradle, à l'empreinte près
        run: |
          props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          read -r adresse somme < <(grep -vE '^[[:space:]]*(#|$)' packaging/gradle.txt)
          [[ $somme =~ ^[0-9a-f]{64}$ ]] || { echo "✗ packaging/gradle.txt : empreinte mal formée"; exit 1; }
          demandee=$(sed -n 's/^distributionUrl=//p' "$props" | sed 's/\\:/:/g')
          [ "$demandee" = "$adresse" ] \
            || { echo "✗ le projet Android demande « $demandee », packaging/gradle.txt fige « $adresse »"; exit 1; }
          if grep -q '^distributionSha256Sum=' "$props"; then echo "✗ $props porte déjà une empreinte"; exit 1; fi
          printf '\ndistributionSha256Sum=%s\n' "$somme" >> "$props"
          echo "✓ Gradle : $adresse, empreinte $somme"
      - name: Manifeste — le micro, pour la voix Mumble
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
      - name: MainActivity — affichage bord à bord
        run: |
          cat > src-tauri/gen/android/app/src/main/java/rn2c/radio_noise_to_come/MainActivity.kt << 'KOTLIN'
          package rn2c.radio_noise_to_come
          import android.os.Bundle
          import androidx.activity.enableEdgeToEdge
          class MainActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
              }
          }
          KOTLIN
      - name: Construire l'APK
        run: cargo tauri android build --apk
      # Le commit dans le nom : l'APK d'un lancement à la main sur une branche ne se confond pas
      # avec celui de l'étiquette.
      - name: Nommer l'APK
        env:
          NUMERO: ${{ needs.version.outputs.numero }}
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          test -f "$apk"
          nom="rn2c-v${NUMERO}-non-signe-${GITHUB_SHA:0:12}.apk"
          cp "$apk" "$nom"
          echo "APK_NON_SIGNE=$nom" >> "$GITHUB_ENV"
      - name: Le relevé du contenu de l'APK, nommé par la liste
        env:
          NUMERO: ${{ needs.version.outputs.numero }}
        run: |
          mkdir -p sortie
          releve=$(scripts/fichiers.sh nom "$NUMERO" android-contenu)
          python3 -B scripts/contenu-apk.py "$APK_NON_SIGNE" > "sortie/$releve"
      # 90 jours, le plus long que GitHub garde : l'APK se signe et se joint dans ce délai.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-non-signe-${{ github.sha }}
          path: ${{ env.APK_NON_SIGNE }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: envoi-releve
        with:
          name: ci-android-contenu
          path: sortie/*
          if-no-files-found: error

  # Il ne lit que les deux .deb : un échec de macOS ou de Windows ne l'arrête pas ; il refuse s'il
  # manque l'un des deux artefacts Linux.
  aur:
    name: Paquet AUR (makepkg)
    needs: [version, bureau]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Les deux artefacts Linux, désignés par leurs jobs
        id: ids
        shell: bash
        env:
          X86_64: ${{ needs.bureau.outputs.linux-x86_64 }}
          ARM64: ${{ needs.bureau.outputs.linux-arm64 }}
        run: |
          for id in "$X86_64" "$ARM64"; do
            [[ $id =~ ^[0-9]+$ ]] \
              || { echo "✗ un artefact Linux n'a pas d'identifiant : sa construction a échoué"; exit 1; }
          done
          echo "ids=$X86_64,$ARM64" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: linux
          merge-multiple: true
      - name: Remplir le PKGBUILD
        env:
          NUMERO: ${{ needs.version.outputs.numero }}
        run: packaging/aur/remplir.sh "$NUMERO" linux construction
      - name: makepkg, puis installation par pacman
        run: |
          pacman -Syu --noconfirm
          useradd -m constructeur
          find linux -name '*.deb' -exec cp {} construction/ \;
          chown -R constructeur construction
          su constructeur -c 'cd construction && makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          pacman -U --noconfirm construction/rn2c-bin-*.pkg.tar.zst
          pacman -Ql rn2c-bin | grep -q '/usr/bin/'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-${{ github.run_id }}
          path: |
            construction/PKGBUILD
            construction/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

  # Le paquet AUR ne retient pas le brouillon : il se pousse à part, par un mainteneur.
  release:
    name: Release en brouillon
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, bureau, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Aucune release n'existe encore pour cette étiquette, brouillon compris
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          if gh release view "$ETIQUETTE" > /dev/null 2>&1; then
            echo "✗ une release existe déjà pour $ETIQUETTE : la supprimer avant de relancer"
            exit 1
          fi
      - name: Les artefacts que la CI joint, désignés par les jobs qui les ont envoyés
        id: ids
        env:
          ID_linux_x86_64: ${{ needs.bureau.outputs.linux-x86_64 }}
          ID_linux_arm64: ${{ needs.bureau.outputs.linux-arm64 }}
          ID_windows_x86_64: ${{ needs.bureau.outputs.windows-x86_64 }}
          ID_macos_universel: ${{ needs.bureau.outputs.macos-universel }}
          ID_android_contenu: ${{ needs.android.outputs.android-contenu }}
        # Un identifiant vide ferait télécharger tous les artefacts du run : chacun est exigé.
        run: |
          artefacts=$(scripts/fichiers.sh artefacts --ci)
          ids=''
          while read -r a; do
            variable="ID_${a//-/_}"
            id=${!variable:-}
            [[ $id =~ ^[0-9]+$ ]] || { echo "✗ $a : aucun identifiant d'artefact rendu par son job"; exit 1; }
            ids="${ids:+$ids,}$id"
          done <<< "$artefacts"
          [ -n "$ids" ] || { echo "✗ aucun artefact à joindre"; exit 1; }
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: fichiers
          merge-multiple: true
      - name: Exactement les fichiers que la CI joint, d'après la liste
        env:
          NUMERO: ${{ needs.version.outputs.numero }}
        run: |
          artefacts=$(scripts/fichiers.sh artefacts --ci)
          # shellcheck disable=SC2086 # un artefact par mot : la liste les borne à [a-z0-9_-]
          scripts/fichiers.sh controler "$NUMERO" "$PWD/fichiers" $artefacts
      - name: Attestation de provenance de chaque fichier que la CI joint
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fichiers/*
      - name: Brouillon, fichiers de la CI joints
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ github.ref_name }}
          NUMERO: ${{ needs.version.outputs.numero }}
        run: |
          empreinte=$(grep -E '^[0-9a-f]{64}$' packaging/empreinte-apk.txt)
          sed -e "s/{{VERSION}}/$NUMERO/g" -e "s/{{EMPREINTE_APK}}/$empreinte/g" packaging/notes-de-version.md > notes.md
          gh release create "$ETIQUETTE" --draft --verify-tag \
            --title "RN2C $NUMERO" --notes-file notes.md fichiers/*
