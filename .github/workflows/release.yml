name: Build & Release

# Une étiquette vX.Y.Z construit tous les formats et prépare une release en BROUILLON.
# Un lancement à la main construit seulement : les fichiers restent en artefacts, rien n'est publié.
# L'APK sort non signé : la clé de signature n'entre jamais sur GitHub, l'APK signé est joint au
# brouillon avant sa publication. Publier le brouillon met releases/latest.json à jour (latest-json.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI: "2.12.2"

jobs:

  version:
    name: Numéro de version
    runs-on: ubuntu-22.04
    outputs:
      numero: ${{ steps.lire.outputs.numero }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: L'étiquette, tauri.conf.json, Cargo.toml et Cargo.lock disent le même numéro
        id: lire
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            numero=$(scripts/version.sh --verifier "$REF_NAME")
          else
            numero=$(scripts/version.sh --verifier)
          fi
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

  bureau:
    name: ${{ matrix.nom }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Linux x86_64
            artefact: linux-x86_64
            machine: ubuntu-22.04
            attendus: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - nom: Linux ARM64
            artefact: linux-arm64
            machine: ubuntu-22.04-arm
            attendus: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - nom: Windows x86_64
            artefact: windows-x86_64
            machine: windows-latest
            attendus: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
              rn2c-v*-portable-win64.zip
          - nom: macOS universel
            artefact: macos-universel
            machine: macos-latest
            cible: universal-apple-darwin
            cibles_rust: aarch64-apple-darwin,x86_64-apple-darwin
            attendus: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.artefact }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Dépendances système
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-gl
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.cibles_rust }}
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI }}" --locked
      - name: Construire
        if: ${{ !matrix.cible }}
        run: cargo tauri build
      - name: Construire (universel)
        if: ${{ matrix.cible }}
        run: cargo tauri build --target "${{ matrix.cible }}"
      - name: Windows sans installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Compress-Archive -Path src-tauri/target/release/rn2c.exe -DestinationPath "rn2c-v${ver}-portable-win64.zip"
      - name: Chaque format attendu est là
        shell: bash
        env:
          ATTENDUS: ${{ matrix.attendus }}
        run: |
          manque=0
          for motif in $ATTENDUS; do
            if ! ls $motif > /dev/null 2>&1; then echo "✗ absent : $motif"; manque=1; fi
          done
          exit $manque
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bureau-${{ matrix.artefact }}
          path: ${{ matrix.attendus }}
          if-no-files-found: error

  android:
    name: Android (APK non signé)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: NDK 26
        run: sdkmanager "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"
      - name: NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI }}" --locked
      - name: Projet Android
        run: cargo tauri android init
      - name: Manifeste — le micro, pour la voix Mumble
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
      - name: MainActivity — affichage bord à bord
        run: |
          cat > src-tauri/gen/android/app/src/main/java/rn2c/radio_noise_to_come/MainActivity.kt << 'KOTLIN'
          package rn2c.radio_noise_to_come
          import android.os.Bundle
          import androidx.activity.enableEdgeToEdge
          class MainActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
              }
          }
          KOTLIN
      - name: Construire l'APK
        run: cargo tauri android build --apk
      - name: Nommer l'APK
        env:
          NUMERO: ${{ needs.version.outputs.numero }}
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          test -f "$apk"
          cp "$apk" "rn2c-v${NUMERO}-non-signe.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-non-signe
          path: rn2c-v*-non-signe.apk
          if-no-files-found: error

  aur:
    name: Paquet AUR (makepkg)
    needs: [version, bureau]
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bureau-linux-*
          path: linux
          merge-multiple: true
      - name: Remplir le PKGBUILD
        env:
          NUMERO: ${{ needs.version.outputs.numero }}
        run: packaging/aur/remplir.sh "$NUMERO" linux construction
      - name: makepkg, puis installation par pacman
        run: |
          pacman -Syu --noconfirm
          useradd -m constructeur
          find linux -name '*.deb' -exec cp {} construction/ \;
          chown -R constructeur construction
          su constructeur -c 'cd construction && makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          pacman -U --noconfirm construction/rn2c-bin-*.pkg.tar.zst
          pacman -Ql rn2c-bin | grep -q '/usr/bin/'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: |
            construction/PKGBUILD
            construction/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Release en brouillon
    if: github.ref_type == 'tag'
    needs: [version, bureau, android, aur]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bureau-*
          path: fichiers
          merge-multiple: true
      - name: Brouillon, fichiers de bureau joints
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETTE: ${{ github.ref_name }}
          NUMERO: ${{ needs.version.outputs.numero }}
        run: |
          sed "s/{{VERSION}}/$NUMERO/g" packaging/notes-de-version.md > notes.md
          mapfile -t joints < <(find fichiers -type f | sort)
          printf '%s\n' "${joints[@]}"
          gh release create "$ETIQUETTE" --draft --verify-tag \
            --title "RN2C $NUMERO" --notes-file notes.md "${joints[@]}"
