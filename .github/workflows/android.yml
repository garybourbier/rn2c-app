name: Android build (dev)

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26 + Set NDK_HOME
        run: |
          sdkmanager "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Rust toolchain + targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked --force

      - name: Init projet Android
        run: cargo tauri android init

      - name: Patch manifest — permissions audio
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
      - name: Patch MainActivity — injecter hauteur nav bar dans WebView
        run: |
          cat > src-tauri/gen/android/app/src/main/java/rn2c/radio_noise_to_come/MainActivity.kt << 'KOTLIN'
          package rn2c.radio_noise_to_come
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.activity.enableEdgeToEdge
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          class MainActivity : TauriActivity() {
              private var navBarPx: Int = 0
              private var webViewRef: WebView? = null
              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
                  ViewCompat.setOnApplyWindowInsetsListener(window.decorView) { view, insets ->
                      val nb = insets.getInsets(WindowInsetsCompat.Type.navigationBars()).bottom
                      if (nb != navBarPx) { navBarPx = nb; injectNavBar() }
                      ViewCompat.onApplyWindowInsets(view, insets)
                  }
              }
              override fun onWebViewCreate(webView: WebView) {
                  webViewRef = webView
                  injectNavBar()
              }
              private fun injectNavBar() {
                  val wv = webViewRef ?: return
                  val script = "document.documentElement.style.setProperty('--safe-bottom','${navBarPx}px');"
                  wv.post { wv.evaluateJavascript(script, null) }
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT))
                      WebViewCompat.addDocumentStartJavaScript(wv, script, setOf("*"))
              }
          }
          KOTLIN

      - name: Build Android APK (non signé)
        run: cargo tauri android build --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rn2c-android-dev-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
