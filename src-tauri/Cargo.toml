[package]
name = "rn2c"
version = "0.1.0"
edition = "2021"

[lib]
name = "rn2c_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
arti-client = { version = "0.25", features = ["tokio", "native-tls", "onion-service-client"] }
tor-rtcompat = { version = "0.25", features = ["tokio", "native-tls"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
